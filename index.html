<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEM Simulators | Interactive Science Simulations &amp; Practice Problems</title>
  <meta name="description" content="Explore free interactive science simulations and self-checking chemistry practice problems in your browser.">

  <!-- GLOBAL ADSENSE SCRIPT -->
  <!-- Replace ca-pub-XXXXXXXXXXXXXXXX with your actual Google AdSense Publisher ID once approved -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
     crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-color: #f8fafc;
      --surface-color: #ffffff;
      --border-color: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --practice-color: #0d9488;
      --practice-hover: #0f766e;
      --badge-sim: #dbeafe;
      --badge-sim-text: #1e40af;
      --badge-practice: #ccfbf1;
      --badge-practice-text: #115e59;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navigation Header */
    header {
      background-color: var(--surface-color);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      text-decoration: none;
      color: var(--text-primary);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .logo span {
      color: var(--accent-color);
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.15s;
    }

    nav a:hover, nav a.active {
      color: var(--accent-color);
    }

    /* Hero Banner */
    .hero {
      background-color: var(--surface-color);
      border-bottom: 1px solid var(--border-color);
      padding: 3rem 1.5rem;
      text-align: center;
    }

    .hero-inner {
      max-width: 760px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    /* Quick Jump / Filter Buttons */
    .hero-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .jump-link {
      text-decoration: none;
      padding: 0.55rem 1.2rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-primary);
      transition: all 0.15s;
    }

    .jump-link:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    /* Main Content Container */
    .container {
      max-width: 1100px;
      width: 100%;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      flex: 1;
    }

    /* Responsive Horizontal Leaderboard Ad Banner */
    .ad-banner-wrapper {
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .ad-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin-bottom: 0.35rem;
      display: block;
    }

    .ad-banner-slot {
      background-color: #f1f5f9;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      min-height: 90px;
      max-width: 970px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Section Headings */
    .library-section {
      margin-bottom: 3.5rem;
      scroll-margin-top: 5rem;
    }

    .section-header {
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.6rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .section-header h2 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .section-header span {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    /* Card Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.75rem;
    }

    .card {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px -5px rgba(15, 23, 42, 0.08);
    }

    .card-preview {
      height: 170px;
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-preview svg {
      width: 100%;
      height: 100%;
    }

    .card-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .badge-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge.sim {
      background-color: var(--badge-sim);
      color: var(--badge-sim-text);
    }

    .badge.practice {
      background-color: var(--badge-practice);
      color: var(--badge-practice-text);
    }

    .badge.subject {
      background-color: #f1f5f9;
      color: #475569;
    }

    .card-body h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .card-body p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      flex: 1;
    }

    .btn-sim {
      display: inline-block;
      text-align: center;
      background-color: var(--accent-color);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.7rem 1rem;
      border-radius: 6px;
      transition: background-color 0.15s;
    }

    .btn-sim:hover {
      background-color: var(--accent-hover);
    }

    .btn-practice {
      display: inline-block;
      text-align: center;
      background-color: var(--practice-color);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.7rem 1rem;
      border-radius: 6px;
      transition: background-color 0.15s;
    }

    .btn-practice:hover {
      background-color: var(--practice-hover);
    }

    /* Footer */
    footer {
      background-color: var(--surface-color);
      border-top: 1px solid var(--border-color);
      padding: 2rem 1.5rem;
      margin-top: 2rem;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    .footer-links a:hover {
      color: var(--accent-color);
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .hero h1 { font-size: 1.75rem; }
      header { padding: 1rem; }
      .footer-inner { flex-direction: column; text-align: center; }
    }
  </style>
</head>
